name: billing-daily

# 毎日 9:07（日本時間）に実行。手動実行（Actions タブの Run workflow）もできます。
on:
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "メールを送らずにログだけ出す（1 = はい）"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 前日のお知らせ・新規申し込みのまとめ
        run: node scripts/billing-daily.mjs
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          ACCOUNT_URL: https://knotscheme.github.io/sakuapp/account/
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '0' }}
