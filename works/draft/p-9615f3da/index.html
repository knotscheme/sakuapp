<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>給与計算代行サービス LP ファーストビュー（たたき台）</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Sans","Noto Sans JP",sans-serif;color:#0f1f3a;background:#fff;font-feature-settings:"palt";letter-spacing:.02em}
header{display:flex;align-items:center;gap:28px;padding:18px 56px;border-bottom:1px solid #e8edf5}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;color:#6b7891;font-size:14px}
.logo i{width:30px;height:30px;border-radius:8px;border:1.5px dashed #b9c3d6;display:block}
nav{display:flex;gap:26px;font-size:14px;color:#3b4a66;margin-left:auto}
.hbtn{background:#f28c28;color:#fff;font-weight:700;font-size:14px;padding:11px 20px;border-radius:999px}
.fv{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;padding:70px 56px 64px;background:linear-gradient(180deg,#f4f8ff 0%,#fff 100%)}
.tag{display:inline-block;font-size:14px;font-weight:700;color:#1d4ed8;background:#e3ecff;padding:7px 14px;border-radius:999px}
h1{font-size:50px;line-height:1.32;margin-top:22px;font-weight:800;letter-spacing:.01em}
h1 em{font-style:normal;color:#1d4ed8}
.lead{font-size:18px;line-height:1.9;color:#3b4a66;margin-top:20px}
.points{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.pt{background:#fff;border:1px solid #dbe4f3;border-radius:14px;padding:12px 16px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.pt b{color:#1d4ed8;font-size:20px}
.ctas{display:flex;gap:14px;margin-top:32px;align-items:center}
.cta{background:#f28c28;color:#fff;font-weight:800;font-size:17px;padding:17px 30px;border-radius:999px;box-shadow:0 10px 24px -10px rgba(242,140,40,.7)}
.cta2{color:#1d4ed8;font-weight:700;font-size:16px;padding:16px 10px}
.note{margin-top:14px;font-size:12px;color:#8a95ab}
.card{background:#fff;border-radius:22px;box-shadow:0 30px 60px -30px rgba(15,31,58,.35);border:1px solid #e8edf5;padding:26px}
.card h3{font-size:15px;color:#6b7891;font-weight:700}
.big{display:flex;align-items:center;gap:12px;margin-top:12px}
.ok{width:40px;height:40px;border-radius:50%;background:#16a34a;color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800}
.big p{font-size:24px;font-weight:800}
.rows{margin-top:20px;border-top:1px solid #eef2f8}
.row{display:flex;justify-content:space-between;padding:13px 2px;border-bottom:1px solid #eef2f8;font-size:15px}
.row span:last-child{color:#16a34a;font-weight:700}
.bar{height:8px;border-radius:99px;background:#eef2f8;margin-top:18px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:#1d4ed8}
.cap{margin-top:10px;font-size:13px;color:#6b7891}
@media(max-width:600px){
 header{padding:14px 18px}nav{display:none}.hbtn{margin-left:auto;font-size:12px;padding:9px 14px}
 .fv{grid-template-columns:1fr;padding:34px 20px 40px;gap:28px}
 h1{font-size:31px}.lead{font-size:15px}.pt{font-size:12.5px;padding:10px 12px}.pt b{font-size:17px}
 .ctas{flex-direction:column;align-items:stretch}.cta{text-align:center;font-size:16px}.cta2{text-align:center}
}
</style></head><body>
<header><div class="logo"><i></i>（貴社ロゴ）</div><nav><span>サービス内容</span><span>料金</span><span>導入の流れ</span><span>よくある質問</span></nav><span class="hbtn">無料で相談する</span></header>
<section class="fv">
 <div>
  <span class="tag">中小企業の経営者・総務ご担当者さまへ</span>
  <h1><span style="display:inline-block">毎月の給与計算を、</span><br><span style="display:inline-block"><em>まるごと</em>お任せ</span><span style="display:inline-block">ください。</span></h1>
  <p class="lead"><span style="display:inline-block">計算・明細の発行・</span><span style="display:inline-block">振込データの作成まで。</span><br><span style="display:inline-block">社内の手間とミスを減らし、</span><span style="display:inline-block">本業に集中できます。</span></p>
  <div class="points"><div class="pt">月額 <b>◯</b>円〜</div><div class="pt">最短 <b>◯</b>日で開始</div><div class="pt">◯名から対応</div></div>
  <div class="ctas"><span class="cta">無料で相談する（1分）</span><span class="cta2">料金を見る ›</span></div>
  <p class="note">※文言・数字は、現在のLPと資料をもとに打ち合わせで確定します（たたき台）</p>
 </div>
 <div class="card">
  <h3>今月の給与計算</h3>
  <div class="big"><span class="ok">✓</span><p>すべて完了しました</p></div>
  <div class="rows">
   <div class="row"><span>給与計算（◯名分）</span><span>完了</span></div>
   <div class="row"><span>給与明細の発行</span><span>完了</span></div>
   <div class="row"><span>振込データの作成</span><span>完了</span></div>
   <div class="row"><span>勤怠データの確認</span><span>完了</span></div>
  </div>
  <div class="bar"><i></i></div><p class="cap">御社の作業は、勤怠データを送るだけ</p>
 </div>
</section>
</body></html>
