<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<base href="../">
<title>テンプレートのプレビュー｜サクアプ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Montserrat:ital,wght@0,700;0,800;1,600&family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3fafa;--card:#fff;--text:#0f2a2e;--muted:#4f6a6e;--line:#d3e8e8;--brand:#0e7c8c;--mint:#e0f3f3;--accent:#f0a010;--ink:#0b6477;--ink-t:#fff;--ink-m:#d4eef0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.8 "Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
h1,h2,h3,p{margin:0}
h1,h2,h3{line-height:1.4;font-weight:900;letter-spacing:.01em}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
section{padding:72px 0}
.alt{background:var(--card);border-block:1px solid var(--line)}
h2{font-size:clamp(24px,4.4vw,34px);margin-bottom:12px}
.lead{color:var(--muted);max-width:620px;margin-bottom:36px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border-radius:99px;background:var(--brand);color:#fff;font-weight:700;text-decoration:none;border:2px solid var(--brand);cursor:pointer;font-size:16px;font-family:inherit}
.btn.sub{background:transparent;color:var(--brand)}
.btn:focus-visible,summary:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.note{font-size:13px;color:var(--muted)}
.ico{display:block;width:48px;height:48px;padding:11px;border-radius:8px;background:var(--mint);color:var(--brand);margin-bottom:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{display:inline-block;width:22px;height:22px;padding:0;background:none;margin:0 8px 0 0;vertical-align:-4px}
.btn .ico.sm{margin-right:8px;vertical-align:middle}
.sec .ico{background:rgba(255,255,255,.08);color:var(--accent)}
.pain .ico{background:rgba(18,196,139,.14)}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.badges span{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px 6px 10px}
.badges .ico.sm{margin:0;color:var(--brand);width:18px;height:18px}
.stage{display:flex;gap:28px;justify-content:center;align-items:flex-end;flex-wrap:wrap}
.stage figure{margin:0}
.win,.phone{background:var(--card);border:1px solid var(--line);box-shadow:0 24px 50px -24px rgba(0,0,0,.35);overflow:hidden;font-size:12px;line-height:1.5;text-align:left}
.win{flex:1 1 520px;max-width:640px;border-radius:8px}
.win .bar{display:flex;gap:6px;align-items:center;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
.win .bar i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.win .bar u{flex:1;text-decoration:none;margin-left:10px;background:var(--card);border-radius:6px;padding:2px 10px;color:var(--muted);font-size:11px}
.win .body{display:grid;grid-template-columns:120px 1fr}
.side{padding:14px;border-right:1px solid var(--line);display:grid;gap:6px;align-content:start}
.side span{padding:6px 8px;border-radius:8px;color:var(--muted)}
.side span.on{background:var(--mint);color:var(--brand);font-weight:700}
.mmain{padding:14px;display:grid;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--muted)}
.kpis b{display:block;font-size:18px;color:var(--text)}
.chart{display:flex;align-items:flex-end;gap:6px;height:64px;padding:8px;border:1px solid var(--line);border-radius:10px}
.chart i{flex:1;background:var(--mint);border-radius:4px 4px 0 0}.chart i.hi{background:var(--accent)}
.mlist div{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.pill{background:var(--mint);color:var(--brand);border-radius:99px;padding:0 8px;font-weight:700;font-size:11px;white-space:nowrap}
.phone{width:236px;flex:none;border:7px solid var(--ink);border-radius:34px}
.phone .notch{width:70px;height:16px;margin:0 auto;background:var(--ink);border-radius:0 0 12px 12px}
.pb{padding:12px 14px 18px;display:grid;gap:10px;min-height:370px;align-content:start}
.pb h4{margin:0;font-size:15px;font-weight:900}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.days span,.slots span{border:1px solid var(--line);border-radius:8px;padding:6px 0}
.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;text-align:center}
.days .on,.slots .on{background:var(--mint);border-color:var(--accent);color:var(--brand);font-weight:700}
.pbtn{background:var(--accent);color:#06251b;border-radius:10px;text-align:center;padding:10px;font-weight:700}
.item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mstep{display:flex;gap:8px;align-items:center;color:var(--muted)}.mstep i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none}.mstep.done i{background:var(--accent);border-color:var(--accent)}.mstep.done{color:var(--text)}
.cap{text-align:center;font-size:13px;color:var(--muted);margin-top:10px}
@media(max-width:520px){.win .body{grid-template-columns:1fr}.side{display:none}.kpis b{font-size:15px}}
/* brand overrides */
section.hero{background:linear-gradient(180deg,#def2f2 0%,#f3fafa 100%)}
.hero h1 em{background:linear-gradient(transparent 62%,#ffe3a0 62%);padding:0 4px}
.btn.main,header .btn{background:linear-gradient(135deg,#ffc247,#f0a010);border-color:transparent;color:#2b1d00;font-weight:900;box-shadow:0 12px 24px -10px rgba(240,160,16,.55)}
.hero .estimate{border-color:#c4e4e6;box-shadow:0 24px 48px -28px rgba(14,124,140,.5)}
.estimate .monthly,.extra .card:first-child{background:linear-gradient(135deg,#16919f,#0b6477)}
.wrap .sec,.wrap .cta{background:linear-gradient(135deg,#16919f 0%,#0b6477 100%)}
.wrap .cta .btn{color:#2b1d00;font-weight:900;background:linear-gradient(135deg,#ffc247,#f0a010);border-color:transparent}
.cta .limited{background:#fff;color:#0b6477}
.sec .ico{background:rgba(255,255,255,.16);color:#fff}
.pain .ico{background:var(--mint)}
.pbtn{color:#2b1d00;background:linear-gradient(135deg,#ffc247,#f0a010)}
.estimate .monthly b,.extra .big{color:#ffd26b}
.phone{border-color:#14343a}.phone .notch{background:#14343a}
.sim .chip[aria-pressed="true"]{background:linear-gradient(135deg,#16919f,#0b6477);border-color:#0b6477}
.sim .chip[aria-pressed="true"] small{color:#d9f1f3}
.sim .chip{padding:14px 16px}
#plans{display:grid;grid-template-columns:repeat(2,1fr)}
.alt .sim{gap:40px}
.alt .sim .result{background:var(--card);border:2px solid var(--brand);box-shadow:0 24px 48px -28px rgba(14,124,140,.5)}
.extra .card:last-child{color:var(--text)}
.win .app{display:grid;grid-template-columns:150px 1fr}
.sb{background:linear-gradient(180deg,#0e7c8c,#0b5766);color:#fff;padding:16px 12px;display:grid;gap:4px;align-content:start}
.sb .lg{font-weight:900;font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sb .lg i{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#ffc247,#f0a010)}
.sb a{display:flex;align-items:center;padding:8px 10px;border-radius:9px;color:#d4eef0}
.sb a.on{background:rgba(255,255,255,.16);color:#fff;font-weight:700}
.sb .ico.sm{width:16px;height:16px;margin-right:8px;vertical-align:0}
.mn{padding:16px;display:grid;gap:12px;background:var(--bg);align-content:start}
.top{display:flex;justify-content:space-between;align-items:center}
.top b{font-size:14px;display:block}.top span{color:var(--muted)}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#16919f,#0b6477);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kp>div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kp small{color:var(--muted);display:block}.kp b{font-size:18px;display:block;line-height:1.3}
.up{color:var(--brand);font-weight:700;font-size:11px}
.pnl{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
.pnl h5{margin:0 0 8px;font-size:12px}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.rw{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.rw .a{width:24px;height:24px;border-radius:50%;background:var(--mint);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:11px;flex:none}
.rw div{flex:1;line-height:1.3}.rw small{color:var(--muted);display:block}
.phone{width:248px}
.pb2{min-height:480px;display:flex;flex-direction:column;background:var(--bg)}
.sbar{display:flex;justify-content:space-between;padding:6px 16px 0;font-size:10px;font-weight:700}
.cover{margin:8px 12px;border-radius:8px;padding:16px 14px;color:#fff;background:linear-gradient(135deg,#16919f,#0b6477);position:relative;overflow:hidden}
.cover::after{content:"";position:absolute;right:-20px;top:-20px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.14)}
.cover b{font-size:16px;display:block}.cover small{opacity:.85}
.pcnt{padding:4px 12px 12px;display:grid;gap:8px;flex:1;align-content:start}
.pcnt h4{margin:2px 0 0;font-size:14px}
.svc{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:9px 11px}
.svc.on{border-color:var(--brand);background:var(--mint)}
.svc small,.mi small{display:block;color:var(--muted)}
.tabs{display:flex;justify-content:space-around;padding:8px 0 10px;border-top:1px solid var(--line);background:var(--card);color:var(--muted);font-size:10px}
.tabs .on{color:var(--brand);font-weight:700}
.thumb{width:42px;height:42px;border-radius:8px;flex:none;background:radial-gradient(circle at 30% 30%,#ffe3a0,#f0a010)}
.thumb.b{background:radial-gradient(circle at 30% 30%,#d9f1f3,#16919f)}
.mi{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}
.mi>div{flex:1;line-height:1.35}
.qty{display:flex;align-items:center;gap:6px;font-weight:700}.qty i{width:20px;height:20px;border-radius:50%;background:var(--mint);color:var(--brand);display:grid;place-items:center;font-style:normal}
.cart{margin:0 12px 12px;border-radius:8px;padding:11px 14px;background:linear-gradient(135deg,#16919f,#0b6477);color:#fff;display:flex;justify-content:space-between;font-weight:700}
.chips2{display:flex;gap:6px;flex-wrap:wrap}.chips2 span{padding:3px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line)}.chips2 .on{background:var(--brand);color:#fff;border-color:var(--brand)}
.tk{border-radius:8px;padding:14px;color:#fff;background:linear-gradient(135deg,#16919f,#0b6477)}
.tk b{font-size:15px}.tk .big2{font-size:26px;font-weight:900;color:#ffd26b}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}.stamps i{aspect-ratio:1;border-radius:50%;border:2px dashed rgba(255,255,255,.55)}.stamps i.f{background:#ffc247;border:0}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;width:60%;background:linear-gradient(90deg,#ffc247,#f0a010)}
.tl{display:grid;gap:10px}.tl div{display:flex;gap:10px;align-items:flex-start;line-height:1.35}.tl i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:2px;background:var(--card)}.tl .d i{background:var(--brand);border-color:var(--brand)}.tl small{color:var(--muted);display:block}
.art{height:92px;border-radius:8px;background:linear-gradient(135deg,#d3eef0,#ffe9b8);display:grid;place-items:center}
.cmt{background:var(--mint);border-radius:8px;padding:8px 10px;color:var(--text)}
@media(max-width:620px){.win .app{grid-template-columns:1fr}.sb{display:none}.two{grid-template-columns:1fr}.kp b{font-size:15px}}
.opt{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;margin-top:8px}
.olist{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:14px;grid-template-columns:1fr 1fr}
.olist li{display:flex;gap:12px;align-items:flex-start;line-height:1.5}
.olist .ico{flex:none;width:40px;height:40px;padding:9px;margin:0}
.olist b{display:block;font-size:15px}.olist small{color:var(--muted);font-size:13px}
.card.care{background:linear-gradient(135deg,#16919f 0%,#0b6477 100%);color:#fff;border:0;display:flex;flex-direction:column}
.card.care h3{color:#fff;margin:0}.card.care p,.card.care small{color:#d9f1f3}
.care .pr{font-size:42px;font-weight:900;color:#ffd26b;line-height:1.2;margin:6px 0 14px}.care .pr small{font-size:15px;color:#fff}
.care ul{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:10px}
.care li{display:flex;gap:8px;align-items:flex-start}.care li .ico{flex:none;width:22px;height:22px;padding:0;margin:2px 0 0;background:none;color:#ffd26b}
.care .five{background:rgba(255,255,255,.14);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-weight:700}
.care .btn{margin-top:auto}
@media(max-width:860px){.opt{grid-template-columns:1fr}}
@media(max-width:520px){.olist{grid-template-columns:1fr}}
/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-weight:900}
header .btn{min-height:40px;padding:0 18px;font-size:14px}
/* hero */
.hero{padding:56px 0 64px}
.hero .wrap{display:grid;gap:36px;grid-template-columns:1.1fr .9fr;align-items:center}
.hero h1{font-size:clamp(28px,6.4vw,56px);margin-bottom:20px}
.hero h1 em{font-style:normal;color:var(--brand)}
.hero p.sub{color:var(--muted);margin-bottom:28px}
.estimate{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
.estimate h3{font-size:14px;color:var(--muted);font-weight:700;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:15px}
.row.total{border-top:1px dashed var(--line);margin-top:6px;padding-top:14px;font-weight:700}
.monthly{margin-top:14px;background:var(--ink);color:var(--ink-t);border-radius:8px;padding:16px 18px;display:flex;justify-content:space-between;align-items:baseline}
.monthly b{font-size:28px;color:var(--accent)}
/* grids */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:24px}
.alt .card{background:var(--bg)}
.card h3{font-size:18px;margin-bottom:8px}
.card p{color:var(--muted);font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--brand);background:var(--mint);border-radius:99px;padding:2px 12px;margin-bottom:10px}
/* pain */
.pain li{list-style:none;padding:18px 20px;border-left:4px solid var(--accent);background:var(--card);border-radius:0 12px 12px 0;font-weight:700}
.pain{padding:0;margin:0;display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
.pain span{display:block;font-weight:400;color:var(--muted);font-size:14px}
/* price */
.plan .price{font-size:30px;font-weight:900;margin:6px 0 2px}
.plan .price small{font-size:14px}
.plan.first{border:2px solid var(--brand)}
.mo{font-size:13px;color:var(--muted)}
.extra{margin-top:16px}
.extra .card{background:var(--ink);color:var(--ink-t);border-color:var(--ink)}
.extra .card p{color:var(--ink-m)}
.extra .big{color:var(--accent)}
/* simulator */
.sim{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;margin-top:40px}
.sim h3{font-size:16px;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:10px 14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;line-height:1.4;text-align:left;min-height:44px}
.chip small{display:block;font-weight:400;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:#fff}
.chip[aria-pressed="true"] small{color:#d6f3e8}
.stepper{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--text);font-size:20px;cursor:pointer}
.stepper output{min-width:90px;text-align:center;font-weight:700}
.result{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:22px;align-self:start}
.alt .result{background:var(--mint)}
.result .row{font-size:14px}
/* steps */
.steps{counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px}
.steps li::before{content:counter(s);display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--mint);color:var(--brand);font-weight:900;margin-bottom:10px}
.steps h3{font-size:17px;margin-bottom:6px}.steps p{font-size:14px;color:var(--muted)}
/* table */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{padding:14px 16px;text-align:left;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{color:var(--muted);font-weight:700}
.us{background:var(--mint);font-weight:700}
thead .us{background:var(--brand);color:#fff}
/* sec */
.sec{background:var(--ink);color:var(--ink-t);border-radius:8px;padding:48px 32px}
.sec .lead{color:var(--ink-m)}
.sec .card{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1)}
.sec .card p{color:var(--ink-m)}
.sec h2{color:#fff}
/* faq */
details{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
summary{cursor:pointer;padding:18px 20px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::after{content:"+";color:var(--brand);font-size:20px;line-height:1}
details[open] summary::after{content:"−"}
details p{padding:0 20px 18px;color:var(--muted);font-size:15px}
/* cta */
.cta{background:var(--ink);color:#fff;text-align:center;border-radius:8px;padding:56px 24px}
.cta p{color:var(--ink-m);margin:12px auto 24px;max-width:540px}
.cta .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.cta .btn{background:var(--accent);border-color:var(--accent);color:#06251b}
.cta .btn.sub{background:transparent;color:#fff;border-color:#ffffff88}
.limited{display:inline-block;background:rgba(18,196,139,.15);color:var(--accent);padding:6px 16px;border-radius:99px;font-size:14px;font-weight:700;margin-bottom:16px}
footer{padding:32px 0 48px;font-size:12px;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
@media(max-width:860px){
 section{padding:56px 0}
 .hero .wrap,.sim{grid-template-columns:1fr}
 .g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}
 .pain{grid-template-columns:1fr}
}
@media(max-width:520px){
 .g2,.g4{grid-template-columns:1fr}
 .sec{padding:36px 20px;border-radius:8px}

.vhero{position:relative;isolation:isolate;overflow:hidden;height:100vh;height:100svh;min-height:520px;padding:84px 20px 104px;display:grid;place-items:center;color:#fff;
 background:radial-gradient(60% 55% at 72% 28%,rgba(255,194,71,.55),transparent 70%),linear-gradient(160deg,#a7dde0 0%,#4aa9b4 52%,#cfeaec 100%)}

.vhero .vshade{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg,rgba(0,0,0,.16) 0%,rgba(0,0,0,.04) 50%,rgba(0,0,0,.26) 100%)}

.vcatch{position:relative;z-index:4;margin:0;writing-mode:vertical-rl;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-weight:700;font-size:clamp(18px,min(5.4vw,3.4svh),32px);line-height:1.9;letter-spacing:.22em;text-shadow:0 1px 12px rgba(0,0,0,.45);text-wrap:nowrap;line-break:strict}

.vcatch span:nth-child(2){animation-delay:.18s}
.vcatch span:nth-child(3){animation-delay:.36s}
.vcatch em{font-style:normal;color:#ffe08a}
@keyframes vup{from{opacity:0;transform:translateY(-18px)}}
.vscroll{position:absolute;z-index:4;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;color:#fff;text-decoration:none;font:700 11px/1 "Noto Sans JP",sans-serif;letter-spacing:.32em;padding:6px 6px 6px calc(6px + .32em)}
.vscroll:focus-visible{outline:3px solid var(--accent);outline-offset:4px;border-radius:8px}

.vscroll .m::before{content:"";position:absolute;left:50%;top:7px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:#ffc247;animation:vwheel 1.8s cubic-bezier(.6,0,.3,1) infinite}

@keyframes vwheel{0%{opacity:0;transform:translateY(0)}20%{opacity:1}75%{opacity:1;transform:translateY(14px)}100%{opacity:0;transform:translateY(16px)}}
@keyframes varrow{0%{opacity:0;transform:translateY(-4px) rotate(45deg)}50%{opacity:1}100%{opacity:0;transform:translateY(5px) rotate(45deg)}}

/* ===== security visual ===== */
.secviz{margin:28px 0 0;width:min(100%,340px)}
.secviz svg{display:block;width:100%;height:auto;overflow:visible}
.secviz .sv-r1{transform-origin:160px 160px;animation:svspin 60s linear infinite}
.secviz .sv-r2{transform-origin:160px 160px;animation:svspin 24s linear infinite reverse}
.secviz .sv-sh{transform-origin:160px 160px;animation:svfloat 5s ease-in-out infinite}
.secviz .sv-n{animation:svpulse 4s ease-in-out infinite}
.secviz .sv-n:nth-child(2){animation-delay:-1s}.secviz .sv-n:nth-child(3){animation-delay:-2s}.secviz .sv-n:nth-child(4){animation-delay:-3s}
.secviz .sv-dots circle{animation:svblink 3s ease-in-out infinite}.secviz .sv-dots circle:nth-child(2n){animation-delay:-1.5s}
.secviz figcaption{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;width:max-content;max-width:calc(100vw - 40px)}
.secviz figcaption span{font-size:12px;font-weight:700;letter-spacing:.04em;color:#fff;padding:4px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.08)}
@keyframes svspin{to{transform:rotate(360deg)}}
@keyframes svfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes svpulse{0%,100%{opacity:.75}50%{opacity:1}}
@keyframes svblink{0%,100%{opacity:.35}50%{opacity:1}}
@media(max-width:860px){.secviz{margin:20px auto 4px;width:min(78vw,300px)}.secviz figcaption{justify-content:center;margin-left:50%;transform:translateX(-50%)}}

html.js .rv.rv-r{transform:translate3d(36px,0,0)}
html.js .rv.rv-z{transform:scale(.94)}

/* ===== pain section as chat ===== */
.bub.chat{display:flex;flex-direction:column;gap:12px;max-width:640px;margin:0 auto;padding:0 16px 20px;background:linear-gradient(180deg,#e9f1f2,#dfeaec);border-radius:24px;box-shadow:0 30px 60px -40px rgba(14,80,95,.45),inset 0 0 0 1px rgba(14,124,140,.08);overflow:hidden}
.bub.chat .chd{display:flex;align-items:center;gap:10px;margin:0 -16px 6px;padding:12px 18px;background:rgba(255,255,255,.7);backdrop-filter:blur(8px);border-bottom:1px solid rgba(14,124,140,.1);font-size:13px;font-weight:700;color:#36545a}
.bub.chat .chd img{width:28px;height:28px;border-radius:50%;object-fit:cover}

.bub.chat .av{flex:none;width:34px;height:34px;border-radius:50%;object-fit:cover;align-self:flex-start;box-shadow:0 0 0 2px #fff}
.bub.chat span.av{box-shadow:none;background:none!important;border:0!important}
.bub.chat .bb{position:relative;background:#fff;border-radius:4px 18px 18px 18px;padding:12px 16px;box-shadow:0 6px 16px -10px rgba(14,60,70,.35);max-width:min(82%,460px)}
.bub.chat .b:first-of-type .bb::before{content:"";position:absolute;left:-7px;top:0;border-top:10px solid #fff;border-left:9px solid transparent}
.bub.chat .bb b{font-size:16px;line-height:1.5;color:#123}

.bub.chat .dots i:nth-child(2){animation-delay:.18s}.bub.chat .dots i:nth-child(3){animation-delay:.36s}
@keyframes tdot{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* =====================================================================
   MODERN THEME (minimal / whitespace) — overrides everything above
   ===================================================================== */
:root{--bg:#fafaf8;--card:#fff;--text:#141716;--muted:#6a706f;--line:#e8e8e3;--brand:#0e7c8c;--mint:#eef5f4;--accent:#ffc83d;--ink:#0f1413;--ink-t:#fff;--ink-m:#a9b3b2;--dark:#0f1413}
body{font-family:"Inter","Noto Sans JP","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-feature-settings:"palt";letter-spacing:.02em;background:var(--bg)}
section{padding:112px 0}
@media(max-width:860px){section{padding:84px 0}}
h1,h2,h3{font-weight:700!important;letter-spacing:.01em}
h2{font-size:clamp(26px,5vw,40px);line-height:1.35;margin-bottom:16px}
.lead{font-size:15px;line-height:1.9;color:var(--muted)}
.alt{background:#fff;border-block:1px solid var(--line)}
/* labels: quiet outline chips */
.tag,.xl,.hero2 .tag{background:transparent!important;border:1px solid var(--line);color:var(--muted)!important;font-weight:600;letter-spacing:.08em;font-size:11px;border-radius:999px;padding:3px 10px}
.hero2 .tag{border-color:rgba(255,255,255,.18);color:#c9d2d1!important}
/* buttons: flat */
.btn,.cta .btn,.wrap .cta .btn,header#hd .btn{background:var(--accent)!important;border-color:var(--accent)!important;color:#141716!important;box-shadow:none!important;font-weight:700;letter-spacing:.04em}
.btn:hover{filter:brightness(.97)}
.btn.sub,.cta .btn.sub{background:transparent!important;color:#fff!important;border:1px solid rgba(255,255,255,.35)!important}
.hero2 .btn.main{animation:none!important}
@media(max-width:860px){header#hd .btn{box-shadow:0 10px 30px -10px rgba(0,0,0,.35)!important}}
header#hd .hbar{background:rgba(15,20,19,.86)!important;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-color:rgba(255,255,255,.08)!important;box-shadow:none!important}
/* hero video: no dot pattern, neutral tint */
.vhero .vtint{background:#7d8584}
/* ---------- dark sections ---------- */
.hero2{background:var(--dark)!important;animation:none!important}
.hero2::before{animation:none!important;width:620px;height:620px;right:-220px;top:-260px;background:radial-gradient(circle,rgba(14,124,140,.45),transparent 62%)!important}
.hero2::after{animation:none!important;background:radial-gradient(circle,rgba(255,200,61,.10),transparent 65%)!important}
.big b{background:none!important;-webkit-text-fill-color:#fff;color:#fff!important;font-family:"Inter",sans-serif;font-weight:800;letter-spacing:-.04em}
.big small{color:#fff;font-weight:700}
.l1{font-weight:600!important;color:#a9b3b2;letter-spacing:.18em!important;font-size:clamp(14px,3.4vw,18px)!important}
.l3 span{background:none!important;color:#7fd3d6}
.hero2 .sub{color:#b9c3c2}
.anchor{color:#a9b3b2}.anchor b{background:#fff;color:var(--dark)}
.stats b{font-family:"Inter","Noto Sans JP",sans-serif;font-weight:700;letter-spacing:-.01em}
.band{background:var(--dark)!important}
.band .lead{color:#a9b3b2}
.band .card,.band .chk li{border-color:rgba(255,255,255,.1)!important}
.band .ico{background:rgba(255,255,255,.06)!important;color:#7fd3d6!important}
#contact::after{background:linear-gradient(90deg,rgba(15,20,19,.94) 0%,rgba(15,20,19,.84) 45%,rgba(15,20,19,.55) 100%)!important}
@media(max-width:860px){#contact::after{background:linear-gradient(180deg,rgba(15,20,19,.8),rgba(15,20,19,.9))!important}}
.cta .limited{background:transparent!important;color:var(--accent)!important;border:1px solid rgba(255,200,61,.5)}
/* ---------- remove marker highlights / glows ---------- */
.endline span{background:none!important}
.endline{color:var(--text)!important;font-weight:700!important}
.pfig::before{display:none!important}
.pfig img{filter:none!important}
/* ---------- surfaces: border, no heavy shadows ---------- */
.card,.xcard,.bub.chat,#why .rows,.cmp2 table,.plist,.chat,.eband,.secviz figcaption span{box-shadow:none!important}
.card,.xcard,#why .rows,.plist{border:1px solid var(--line)!important;border-radius:20px!important}

/* emphasis blocks: flat dark instead of teal gradient */

.mk.g2{background:var(--text)!important}
.cmp-hl{color:var(--text);text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:5px}

.pr1.first{background:#f6f7f5!important;box-shadow:inset 3px 0 0 var(--text)!important}
.tl2 .dot{background:var(--text)!important;color:#fff!important}.tl2 .dot.g{background:var(--accent)!important;color:#141716!important}
/* numbers in Inter */
.pp b,.xp,.xpm b,.xpn b,#usecase .sum>b,.sum b,.rows .n,.cu{font-family:"Inter","Noto Sans JP",sans-serif}
.rows .n{-webkit-text-stroke:1.2px var(--text)!important;font-weight:700!important}

html.js .rv{transform:translate3d(0,16px,0)}
html.js .rv.rv-l,html.js .rv.rv-r{transform:translate3d(0,16px,0)}

/* modern theme: remaining LP-level teal blocks (demo app screens keep their own colors) */

/* sticker icons above heads */
